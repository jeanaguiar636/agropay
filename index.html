<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroTrade VIP - Simulação de Commodities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-amber-500/30 rounded-2xl p-8 shadow-2xl shadow-amber-500/10">
        <div class="text-center mb-8">
            <span class="bg-amber-500/10 text-amber-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-amber-500/20">Plataforma Exclusiva</span>
            <h1 class="text-3xl font-extrabold text-white mt-3 tracking-tight">AgroTrade <span class="text-amber-400">VIP</span></h1>
            <p class="text-slate-300 text-sm mt-2">Negocie commodities agrícolas, acerte o gráfico e multiplique seus <span class="text-amber-400 font-bold">ZPay ($ZP)</span> hoje mesmo!</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-white mb-1">Nome de Usuário</label>
                <input type="text" id="username" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 font-medium" placeholder="Ex: trader_pro">
            </div>
            <div>
                <label class="block text-sm font-semibold text-white mb-1">E-mail</label>
                <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 font-medium" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-sm font-semibold text-white mb-1">Senha</label>
                <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 font-medium" placeholder="••••••••">
            </div>
            <div>
                <label class="block text-sm font-semibold text-white mb-1">Foto de Perfil <span class="text-xs text-slate-400">(Opcional)</span></label>
                <input type="file" id="profilePic" accept="image/*" class="w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
            </div>

            <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4 text-center mt-4">
                <p class="text-amber-300 text-sm font-bold">🎁 Bônus de Boas-Vindas:</p>
                <p class="text-white text-xs mt-1">Você ganha <span class="text-amber-400 font-bold text-base">100 $ZP</span> (10 partidas gratuitas) ao criar sua conta agora!</p>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold py-3.5 rounded-xl shadow-lg shadow-amber-500/20 hover:opacity-95 transition-all text-base mt-2">
                Criar Conta e Resgatar Bônus
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            Já tem uma conta? <a href="login.html" class="text-amber-400 font-bold hover:underline">Fazer Login</a>
        </p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Inicializa a conta com 100 ZPay (10 partidas) e dados básicos
            const userData = {
                username,
                email,
                password,
                balance: 100,
                gamesPlayed: 0
            };

            localStorage.setItem('currentUser', JSON.stringify(userData));
            alert('Conta criada com sucesso! Você ganhou 100 $ZP de bônus.');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
