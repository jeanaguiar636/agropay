<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroTrade Pro - A carregar...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-sm w-full bg-[#1e293b] border border-slate-800 p-6 rounded-2xl shadow-2xl text-center space-y-4">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text text-transparent">AgroTrade Pro</h1>
        <p class="text-xs text-slate-400">A preparar o seu painel de trading...</p>
        
        <div class="flex justify-center py-2">
            <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <div class="pt-2">
            <a href="app.html" class="block w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg">
                Entrar Manualmente
            </a>
        </div>
    </div>

    <script>
        // Redireciona automaticamente para o painel app.html
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                window.location.href = 'app.html';
            }, 800);
        });
    </script>
</body>
</html>
