<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroTrade Pro - Redirecionando...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex items-center justify-center">
    <div class="text-center space-y-4 p-6 bg-[#1e293b] border border-slate-800 rounded-2xl shadow-xl max-w-sm w-full">
        <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text text-transparent">AgroTrade Pro</h1>
        <p class="text-xs text-slate-400">A carregar o seu painel de trading...</p>
        <div class="flex justify-center">
            <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <div class="pt-2">
            <a href="login.html" class="block w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-sm transition">Entrar na Conta</a>
        </div>
    </div>

    <script>
        // Se já houver um utilizador logado, vai direto para o dashboard, senão vai para o login
        setTimeout(() => {
            const savedUser = localStorage.getItem('agro_user');
            if (savedUser) {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html';
            }
        }, 1000);
    </script>
</body>
</html>
