<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroTrade Pro - Criar Conta</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-[#1e293b] border border-slate-800 p-6 rounded-2xl shadow-2xl space-y-6">
<div class="text-center space-y-1">
<h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text text-transparent">Criar Conta</h1>
<p class="text-xs text-slate-400">Registe-se para começar a negociar</p>
</div>
<form id="register-form" class="space-y-4">
<div>
<label class="block text-xs text-slate-400 mb-1">Nome de Utilizador</label>
<input type="text" id="username" required placeholder="O seu nome" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500">
</div>
<div>
<label class="block text-xs text-slate-400 mb-1">E-mail</label>
<input type="email" id="email" required placeholder="ex: seu@email.com" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500">
</div>
<div>
<label class="block text-xs text-slate-400 mb-1">Palavra-passe</label>
<input type="password" id="password" required placeholder="••••••••" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500">
</div>
<div id="reg-msg" class="text-xs text-center hidden"></div>
<button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
Criar Conta na Nuvem
</button>
</form>
<div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-800">
Já tem uma conta? <a href="index.html" class="text-emerald-400 hover:underline font-semibold">Fazer Login</a>
</div>
</div>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
e.preventDefault();
const username = document.getElementById('username').value.trim();
const email = document.getElementById('email').value.trim();
const password = document.getElementById('password').value.trim();
const msg = document.getElementById('reg-msg');
msg.className = "text-xs text-center text-slate-400";
msg.innerText = "A guardar na base de dados...";
msg.classList.remove('hidden');
try {
const res = await fetch('/api/register', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ username, email, password })
});
const data = await res.json();
if (res.ok && data.success) {
msg.className = "text-xs text-center text-emerald-400";
msg.innerText = "Conta criada com sucesso! Redirecionando...";
setTimeout(() => {
window.location.href = 'index.html';
}, 1500);
} else {
msg.className = "text-xs text-center text-rose-400";
msg.innerText = data.error || 'Erro ao criar conta.';
}
} catch (err) {
msg.className = "text-xs text-center text-rose-400";
msg.innerText = 'Erro de ligação ao servidor cloud.';
}
});
</script>
</body>
  </html>
