<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroTrade Pro - Painel do Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- SECÇÃO DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-[#0f172a] z-50 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-[#1e293b] border border-slate-800 p-6 rounded-2xl shadow-2xl space-y-6">
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text text-transparent">AgroTrade Pro</h1>
                <p class="text-xs text-slate-400">Entre com a sua conta ligada à nuvem D1</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">E-mail</label>
                    <input type="email" id="login-email" required placeholder="ex: afiliado9591@gmail.com" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Palavra-passe</label>
                    <input type="password" id="login-pass" required placeholder="••••••••" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <div id="login-error" class="text-xs text-rose-400 text-center hidden"></div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
                    Entrar no Painel
                </button>
            </form>
        </div>
    </div>

    <!-- PAINEL PROFISSIONAL DO TRADER -->
    <div id="dashboard-screen" class="hidden flex-1 flex flex-col">
        <!-- Top Navigation -->
        <header class="bg-[#1e293b] border-b border-slate-800 px-4 py-3 flex justify-between items-center sticky top-0 z-40 shadow-md">
            <div class="flex items-center gap-2">
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text text-transparent">AgroTrade Pro</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="logout()" class="bg-rose-950/40 text-rose-400 hover:bg-rose-900/40 border border-rose-500/30 px-3 py-1.5 rounded-xl text-sm font-semibold transition">Sair</button>
            </div>
        </header>

        <!-- Commodities Horizontal Menu -->
        <nav class="bg-[#162032] border-b border-slate-800 px-4 py-3 overflow-x-auto flex gap-3 no-scrollbar">
            <button onclick="selectCommodity('Café', 450, 12.5)" class="commodity-btn bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap shadow-lg transition">Café</button>
            <button onclick="selectCommodity('Trigo', 320, 8.2)" class="commodity-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap border border-slate-700 transition">Trigo</button>
            <button onclick="selectCommodity('Feijão', 210, 15.4)" class="commodity-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap border border-slate-700 transition">Feijão</button>
            <button onclick="selectCommodity('Arroz', 540, 8.1)" class="commodity-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap border border-slate-700 transition">Arroz</button>
        </nav>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto w-full p-4 flex-1 space-y-4 pb-12">
            <!-- Saldo Card -->
            <div class="bg-[#1e293b] border border-slate-800 p-5 rounded-2xl shadow-xl flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Saldo Disponível (Nuvem D1)</p>
                    <h2 id="user-balance" class="text-2xl font-black text-emerald-400 mt-1">100 ZPay ($ZP)</h2>
                    <p id="user-welcome" class="text-xs text-slate-400 mt-0.5">Carregando...</p>
                </div>
            </div>

            <!-- Ativo Selecionado & Operação -->
            <div class="bg-[#1e293b] border border-slate-800 p-5 rounded-2xl space-y-4 shadow-xl">
                <div class="flex justify-between items-center">
                    <span class="text-xs text-emerald-400 font-semibold uppercase tracking-wider">Ativo em Tempo Real</span>
                    <span id="selected-title" class="text-xl font-bold text-white">Saca de Café</span>
                </div>
                <div class="flex justify-between items-center bg-[#0f172a] p-3 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-400">Cotação Atual:</span>
                    <span id="live-price" class="text-lg font-bold text-amber-400">450.00 $ZP</span>
                </div>

                <!-- Input de Valor da Operação -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Valor da Operação ($ZP)</label>
                    <input type="number" id="trade-amount" value="50" min="1" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <!-- Botões de Ação -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="executeTrade('COMPRAR')" class="bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-900/30 transition flex items-center justify-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span>
                        COMPRAR (Alta)
                    </button>
                    <button onclick="executeTrade('VENDER')" class="bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-rose-900/30 transition flex items-center justify-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span>
                        VENDER (Baixa)
                    </button>
                </div>
            </div>

            <!-- RESULTADO DA OPERAÇÃO EM TEMPO REAL -->
            <div id="result-card" class="hidden bg-[#1e293b] border p-5 rounded-2xl shadow-2xl space-y-3 transition-all duration-300">
                <div class="flex justify-between items-center">
                    <span id="result-type-badge" class="text-xs font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider"></span>
                    <span class="text-xs text-slate-400">Ativo: <strong id="result-commodity" class="text-white"></strong></span>
                </div>
                <div class="text-center py-3">
                    <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Resultado da Operação</p>
                    <h3 id="result-value" class="text-3xl font-black">0.00 $ZP</h3>
                    <p id="result-status-text" class="text-xs font-medium mt-1"></p>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="closeResult()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition border border-slate-700">
                        Fechar & Nova Operação
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Completo -->
    <script>
        let currentUser = null;
        let currentCommodity = "Café";
        let currentPrice = 450;

        function checkLoginState() {
            const savedUser = localStorage.getItem('agro_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    document.getElementById('user-welcome').innerText = "Bem-vindo, " + currentUser.username + " (" + currentUser.email + ")";
                    document.getElementById('user-balance').innerText = (currentUser.balance !== undefined ? currentUser.balance : 100) + " ZPay ($ZP)";
                } catch(e) {
                    localStorage.removeItem('agro_user');
                }
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-pass').value.trim();
            const errorDiv = document.getElementById('login-error');
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('agro_user', JSON.stringify(data.user));
                    checkLoginState();
                } else {
                    errorDiv.innerText = data.error || 'E-mail ou palavra-passe incorretos.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'Erro de ligação ao servidor.';
                errorDiv.classList.remove('hidden');
            }
        });

        function logout() {
            localStorage.removeItem('agro_user');
            location.reload();
        }

        function selectCommodity(name, price, trend) {
            currentCommodity = name;
            currentPrice = price;
            document.getElementById('selected-title').innerText = "Saca de " + name;
            document.getElementById('live-price').innerText = price.toFixed(2) + " $ZP";
            
            document.querySelectorAll('.commodity-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-lg');
                btn.classList.add('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
                if(btn.innerText.includes(name)) {
                    btn.classList.add('bg-emerald-600', 'text-white', 'shadow-lg');
                    btn.classList.remove('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
                }
            });
        }

        function executeTrade(type) {
            const amountInput = document.getElementById('trade-amount');
            const investVal = parseFloat(amountInput.value) || 0;

            if (investVal <= 0) {
                alert("Introduza um valor válido para operar.");
                return;
            }

            const isWin = Math.random() > 0.4;
            const percentage = isWin ? (Math.random() * 70 + 15) : -(Math.random() * 60 + 10);
            const resultValue = (investVal * (percentage / 100));

            const resultCard = document.getElementById('result-card');
            const badge = document.getElementById('result-type-badge');
            const valEl = document.getElementById('result-value');
            const statusText = document.getElementById('result-status-text');
            const commEl = document.getElementById('result-commodity');

            commEl.innerText = currentCommodity + " (" + type + ")";

            if (isWin) {
                resultCard.className = "bg-emerald-950/30 border border-emerald-500/50 p-5 rounded-2xl shadow-2xl space-y-3 transition-all duration-300";
                badge.className = "text-xs font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider bg-emerald-500/20 text-emerald-400";
                badge.innerText = "Lucro Obtido";
                valEl.className = "text-3xl font-black text-emerald-400";
                valEl.innerText = "+" + resultValue.toFixed(2) + " $ZP (+" + percentage.toFixed(1) + "%)";
                statusText.className = "text-xs font-medium mt-1 text-emerald-300";
                statusText.innerText = "Parabéns! A sua previsão em " + type + " foi certeira.";
            } else {
                resultCard.className = "bg-rose-950/30 border border-rose-500/50 p-5 rounded-2xl shadow-2xl space-y-3 transition-all duration-300";
                badge.className = "text-xs font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider bg-rose-500/20 text-rose-400";
                badge.innerText = "Prejuízo Registado";
                valEl.className = "text-3xl font-black text-rose-400";
                valEl.innerText = resultValue.toFixed(2) + " $ZP (" + percentage.toFixed(1) + "%)";
                statusText.className = "text-xs font-medium mt-1 text-rose-300";
                statusText.innerText = "Mercado oscilou contra a sua posição. Tente novamente!";
            }

            if (currentUser) {
                currentUser.balance = Math.round((currentUser.balance || 100) + resultValue);
                localStorage.setItem('agro_user', JSON.stringify(currentUser));
                document.getElementById('user-balance').innerText = currentUser.balance + ' ZPay ($ZP)';
            }

            resultCard.classList.remove('hidden');
            resultCard.scrollIntoView({ behavior: 'smooth' });
        }

        function closeResult() {
            document.getElementById('result-card').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', checkLoginState);
    </script>
</body>
</html>
```
