<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — AgroPay</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}.hidden{display:none!important}</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
  <div class="max-w-6xl mx-auto">
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-8 border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-emerald-400">AgroPay — Master Admin</h1>
        <p class="text-slate-400 text-sm">Gestão de utilizadores e saldos ZP</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="adminEmail" class="bg-slate-800 px-3 py-2 rounded-lg border border-slate-700 text-xs">—</span>
        <a href="/app" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-sm">Painel Trader</a>
        <button id="logout" class="bg-rose-950/50 text-rose-300 border border-rose-500/30 hover:bg-rose-900/50 px-3 py-2 rounded-lg text-sm">Sair</button>
      </div>
    </header>

    <div id="denied" class="hidden bg-rose-950/40 border border-rose-500/40 text-rose-200 p-6 rounded-xl text-center">
      Acesso restrito a administradores.
      <a href="/" class="underline block mt-2 text-sm">Voltar ao início</a>
    </div>

    <div id="content" class="hidden space-y-6">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
          <p class="text-xs text-slate-400 uppercase tracking-wide">Utilizadores</p>
          <p id="statUsers" class="text-2xl font-black text-emerald-400 mt-1">0</p>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
          <p class="text-xs text-slate-400 uppercase tracking-wide">Operações</p>
          <p id="statTrades" class="text-2xl font-black text-amber-400 mt-1">0</p>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
          <p class="text-xs text-slate-400 uppercase tracking-wide">Volume operado</p>
          <p id="statVolume" class="text-2xl font-black text-sky-400 mt-1">0</p>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
          <p class="text-xs text-slate-400 uppercase tracking-wide">Saldo em circulação</p>
          <p id="statBalances" class="text-2xl font-black text-fuchsia-400 mt-1">0</p>
        </div>
      </div>

      <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700">
        <div class="p-4 font-semibold text-lg border-b border-slate-700 flex justify-between items-center">
          <span>Utilizadores registados</span>
          <button id="reload" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg">Atualizar</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-700 text-slate-300 text-xs uppercase">
                <th class="p-3">ID</th>
                <th class="p-3">Nome</th>
                <th class="p-3">E-mail</th>
                <th class="p-3">Operações</th>
                <th class="p-3">Saldo (ZP)</th>
                <th class="p-3">Ações</th>
              </tr>
            </thead>
            <tbody id="userList" class="divide-y divide-slate-700">
              <tr><td colspan="6" class="p-4 text-center text-slate-400">A carregar…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const money = (v) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(v) || 0);
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function api(path, options = {}) {
    const res = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...options });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (res.status === 401) { location.replace('/'); throw new Error('Sessão expirada.'); }
    if (res.status === 403) { throw Object.assign(new Error('Acesso restrito a administradores.'), { forbidden: true }); }
    if (!res.ok) throw new Error(data.error || 'Erro no servidor.');
    return data;
  }

  async function loadUsers() {
    const tbody = $('userList');
    try {
      const users = await api('/api/admin/users');
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Nenhum utilizador registado.</td></tr>';
        return;
      }
      tbody.innerHTML = users.map((u) =>
        '<tr class="hover:bg-slate-700/40">' +
          '<td class="p-3 font-mono text-slate-400">#' + u.id + '</td>' +
          '<td class="p-3 font-medium text-white">' + esc(u.username) + (u.isAdmin ? ' <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded">ADMIN</span>' : '') + '</td>' +
          '<td class="p-3 text-slate-300">' + esc(u.email) + '</td>' +
          '<td class="p-3 text-slate-400">' + u.trades + '</td>' +
          '<td class="p-3 font-semibold text-emerald-400">' + money(u.balance) + '</td>' +
          '<td class="p-3"><button data-user="' + u.id + '" data-balance="' + u.balance + '" class="adjust bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-sm font-medium">Ajustar saldo</button></td>' +
        '</tr>'
      ).join('');
    } catch (err) {
      if (err.forbidden) return deny();
      tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-rose-400">' + esc(err.message) + '</td></tr>';
    }
  }

  async function loadStats() {
    try {
      const s = await api('/api/admin/stats');
      $('statUsers').textContent = s.users;
      $('statTrades').textContent = s.trades;
      $('statVolume').textContent = money(s.volume) + ' ZP';
      $('statBalances').textContent = money(s.balances) + ' ZP';
    } catch { /* stats are optional */ }
  }

  function deny() {
    $('content').classList.add('hidden');
    $('denied').classList.remove('hidden');
  }

  document.addEventListener('click', async (event) => {
    const btn = event.target.closest('.adjust');
    if (!btn) return;
    const userId = Number(btn.dataset.user);
    const current = Number(btn.dataset.balance);
    const input = prompt('Novo saldo ZP para o utilizador #' + userId + ':', String(current));
    if (input === null) return;
    const newBalance = Number(input.replace(',', '.'));
    if (!Number.isFinite(newBalance) || newBalance < 0) { alert('Valor inválido.'); return; }

    try {
      await api('/api/admin/balance', { method: 'POST', body: JSON.stringify({ userId, newBalance }) });
      loadUsers();
      loadStats();
    } catch (err) { alert(err.message); }
  });

  $('reload').addEventListener('click', () => { loadUsers(); loadStats(); });
  $('logout').addEventListener('click', async () => {
    try { await api('/api/logout', { method: 'POST' }); } catch { /* ignore */ }
    location.replace('/');
  });

  (async () => {
    try {
      const me = await api('/api/me');
      if (!me.user.isAdmin) return deny();
      $('adminEmail').textContent = me.user.email;
      $('content').classList.remove('hidden');
      loadUsers();
      loadStats();
    } catch (err) {
      if (err.forbidden) return deny();
    }
  })();
})();
</script>
</body>
</html>
