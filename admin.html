<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master Admin - AgroTrade VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400">AgroTrade VIP - Master Admin</h1>
                <p class="text-slate-400 text-sm">Gestão de Utilizadores e Saldos ZPay</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 text-sm">
                    Admin: <span class="text-emerald-400 font-semibold">jeanaguiar636@gmail.com</span>
                </div>
                <a href="dashboard.html" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition">Ver Painel Trader</a>
            </div>
        </header>

        <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700">
            <div class="p-4 bg-slate-750 font-semibold text-lg border-b border-slate-700">Lista de Todos os Utilizadores Registados</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-700 text-slate-300 text-sm uppercase">
                            <th class="p-3">ID</th>
                            <th class="p-3">Nome</th>
                            <th class="p-3">E-mail</th>
                            <th class="p-3">Saldo ZPay ($ZP)</th>
                            <th class="p-3">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="user-list" class="divide-y divide-slate-700">
                        <tr><td colspan="5" class="p-4 text-center text-slate-400">A carregar utilizadores...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const res = await fetch('/api/admin');
                const users = await res.json();
                const tbody = document.getElementById('user-list');
                tbody.innerHTML = '';

                if (!Array.isArray(users)) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">Erro ao carregar dados do servidor.</td></tr>`;
                    return;
                }

                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-750 transition';
                    tr.innerHTML = `
                        <td class="p-3 font-mono text-slate-400">#${user.id}</td>
                        <td class="p-3 font-medium text-white">${user.username}</td>
                        <td class="p-3 text-slate-300">${user.email}</td>
                        <td class="p-3 font-semibold text-emerald-400">${user.balance} $ZP</td>
                        <td class="p-3">
                            <button onclick="updateBalance(${user.id}, ${user.balance})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-sm transition font-medium">
                                Ajustar Saldo
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                alert('Erro ao ligar ao servidor.');
            }
        }

        async function updateBalance(userId, currentBalance) {
            const newBal = prompt("Digite o novo valor para o saldo ZPay deste utilizador:", currentBalance);
            if (newBal !== null && !isNaN(newBal)) {
                const res = await fetch('/api/admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, newBalance: parseInt(newBal) })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Saldo ZPay atualizado com sucesso!');
                    loadUsers();
                } else {
                    alert('Erro: ' + (data.error || 'Desconhecido'));
                }
            }
        }

        loadUsers();
    </script>
</body>
</html>
