<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgroTrade VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-amber-500/30 rounded-2xl p-8 shadow-2xl shadow-amber-500/10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Entrar no <span class="text-amber-400">AgroTrade</span></h1>
            <p class="text-slate-300 text-sm mt-2">Acesse sua carteira de ZPay e continue operando.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-white mb-1">E-mail</label>
                <input type="email" id="loginEmail" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 font-medium" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-sm font-semibold text-white mb-1">Senha</label>
                <input type="password" id="loginPassword" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 font-medium" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold py-3.5 rounded-xl shadow-lg shadow-amber-500/20 hover:opacity-95 transition-all text-base mt-2">
                Entrar na Plataforma
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            Não tem uma conta? <a href="index.html" class="text-amber-400 font-bold hover:underline">Cadastre-se</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const user = JSON.parse(localStorage.getItem('currentUser'));

            if (user && user.email === email) {
                window.location.href = 'dashboard.html';
            } else {
                alert('E-mail não encontrado. Faça o cadastro primeiro!');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
